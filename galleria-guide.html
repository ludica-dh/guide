<!doctype html>
<html lang="it">
<!--
COME PUBBLICARE
1. Carica questo HTML nella radice del repository pubblico.
2. Crea accanto all'HTML una cartella chiamata pdf e carica lì i documenti.
3. Abilita GitHub Pages nelle impostazioni del repository e apri l'URL Pages.
4. Se Pages pubblica dalla cartella docs, metti HTML e pdf dentro docs e
   imposta sourceRoot: "docs" nel blocco CONFIG più sotto.
5. Se il ramo Pages non è quello predefinito del repository, imposta branch.
6. Usa nomi esatti: GitHub distingue maiuscole/minuscole. Niente sottocartelle.
7. WordPress: inserisci nel blocco HTML personalizzato questo iframe,
   sostituendo UTENTE, REPOSITORY e il nome dell'HTML se lo hai rinominato:
   <iframe src="https://UTENTE.github.io/REPOSITORY/galleria-guide-github.html"
     title="Guide del LUDiCa" width="100%" height="900"
     style="border:0;width:100%;display:block" loading="lazy"></iframe>

Le schede prendono il titolo dal nome del PDF; la ricerca riguarda il titolo.
Dopo ogni caricamento attendi la pubblicazione di Pages e ricarica la galleria.
Il lettore nativo del browser offre i propri comandi; su dispositivi che non
supportano PDF incorporati usa Apri PDF. Non sono incluse miniature delle pagine.
L'elenco usa l'API pubblica GitHub, soggetta a limiti di richieste e di elementi
per cartella. Documentazione: https://docs.github.com/en/rest/repos/contents
Non sono richiesti token, plugin, file JSON o librerie esterne per il lettore.
Verificata la logica con dati simulati; rendering PDF e repository reale da
collaudare dopo la pubblicazione. Nessun PDF dell'utente è incluso nel file.
-->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Galleria delle guide LUDiCa con lettore PDF integrato">
  <title>Guide del LUDiCa</title>
    <style>
    :root{--ink:#202124;--muted:#64717b;--red:#c50000;--blue:#008fd5;--paper:#f4f7f9;--line:#d9e0e5;--white:#fff;--shadow:0 12px 32px rgba(25,38,48,.13)}
    *{box-sizing:border-box}
    body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
    button,input{font:inherit}
    button{cursor:pointer}
    .site{max-width:1220px;margin:auto;padding:clamp(22px,4vw,58px)}
    .hero{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;margin-bottom:30px}
    .eyebrow{color:var(--red);font-size:.82rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
    h1{margin:.15em 0 .1em;font-size:clamp(2rem,5vw,4.3rem);line-height:1.03;letter-spacing:-.04em}
    .intro{max-width:720px;margin:0;color:var(--muted);font-size:1.05rem}
    .counter{min-width:110px;text-align:right;color:var(--muted)}
    .counter strong{display:block;color:var(--ink);font-size:2rem;line-height:1}
    .tools{display:flex;gap:12px;align-items:center;margin:0 0 28px}
    .search{width:min(560px,100%);border:1px solid var(--line);border-radius:14px;background:var(--white);padding:13px 16px;color:var(--ink);outline:none}
    .search:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,143,213,.14)}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:22px}
    .card{display:flex;min-height:100%;flex-direction:column;overflow:hidden;border:1px solid var(--line);border-radius:18px;background:var(--white);box-shadow:0 4px 15px rgba(25,38,48,.06);transition:transform .18s,box-shadow .18s}
    .card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
    .cover{position:relative;aspect-ratio:4/3;overflow:hidden;background:linear-gradient(135deg,#eaf6fb,#f8eeee)}
    .cover img{width:100%;height:100%;display:block;object-fit:cover}
    .cover.no-image::after{content:"PDF";position:absolute;inset:0;display:grid;place-items:center;color:var(--red);font-size:3rem;font-weight:900;letter-spacing:.08em}
    .card-body{display:flex;flex:1;flex-direction:column;padding:20px}
    .card h2{margin:0 0 8px;font-size:1.25rem;line-height:1.25}
    .description{display:-webkit-box;overflow:hidden;margin:0 0 18px;color:var(--muted);-webkit-box-orient:vertical;-webkit-line-clamp:4}
    .read{align-self:flex-start;margin-top:auto;border:0;border-radius:999px;background:var(--ink);color:var(--white);padding:10px 18px;font-weight:750}
    .read:hover,.read:focus-visible{background:var(--red)}
    .status{grid-column:1/-1;border:1px solid var(--line);border-radius:16px;background:var(--white);padding:28px;text-align:center;color:var(--muted)}
    .dialog{width:min(1120px,96vw);height:min(94vh,950px);max-width:none;max-height:none;padding:0;border:0;border-radius:18px;background:#2b3035;color:white;box-shadow:0 22px 80px rgba(0,0,0,.4)}
    .dialog::backdrop{background:rgba(14,18,21,.78);backdrop-filter:blur(4px)}
    .viewer{display:grid;height:100%;grid-template-rows:auto 1fr}
    .viewer-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:12px 14px;background:#171a1d}
    .viewer-title{overflow:hidden;margin:0;font-size:1rem;text-overflow:ellipsis;white-space:nowrap}
    .controls{display:flex;flex-wrap:wrap;gap:7px;justify-content:flex-end;align-items:center}
    .controls button{min-width:38px;border:1px solid #535b62;border-radius:8px;background:#30363b;color:#fff;padding:7px 10px}
    .controls button:hover,.controls button:focus-visible{border-color:#fff;background:#454d54}
    .stage{min-height:0;overflow:hidden;display:flex;flex-direction:column;background:#454b50;overscroll-behavior:contain}
    .pdf-frame{display:block;width:100%;flex:1;min-height:200px;border:0;background:#fff}
    .reader-help{margin:0;padding:10px 16px;font-size:.86rem;background:#30363b;color:#fff}
    .reader-help a,.controls a{color:#fff;text-decoration:underline}
    .controls a{padding:7px 10px;border:1px solid #535b62;border-radius:8px}
    .card-link{color:inherit;text-decoration:none}
    button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
    body.reading{overflow:hidden}
    .dialog:not([open]){display:none}
    @supports not (height:100dvh){.dialog{height:94vh}}
    @supports (height:100dvh){.dialog{height:94dvh}}
    .viewer-message{align-self:center;max-width:680px;border-radius:12px;background:#fff;color:var(--ink);padding:18px 22px;text-align:center}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:700px){.site{padding:22px 16px}.hero{grid-template-columns:1fr}.counter{text-align:left}.viewer-head{grid-template-columns:1fr}.controls{justify-content:flex-start}.dialog{width:100vw;height:100vh;border-radius:0}.stage{padding:10px}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="site">
    <header class="hero">
      <div>
        <div class="eyebrow">Le guide L U Di Ca</div>
        <h1>Le guide del LUDiCa</h1>
        <p class="intro">Aperte, libere, sempre in aggiornamento</p>
      </div>
      <div class="counter" aria-live="polite"><strong id="count">0</strong><span>guide</span></div>
    </header>
    <div class="tools">
      <label class="sr-only" for="search">Cerca per titolo delle guide</label>
      <input class="search" id="search" type="search" placeholder="Cerca una guida…" autocomplete="off">
    </div>
    <noscript>Attiva JavaScript per caricare l’elenco dei PDF da GitHub.</noscript>
    <section class="grid" id="gallery" aria-live="polite"><div class="status">Caricamento delle guide…</div></section>
  </main>

  <dialog class="dialog" id="reader" aria-labelledby="readerTitle">
    <div class="viewer">
      <header class="viewer-head">
        <h2 class="viewer-title" id="readerTitle">Guida</h2>
        <div class="controls" aria-label="Comandi del lettore">
          <a id="openOriginal" href="#" target="_blank" rel="noopener noreferrer">Apri PDF ↗</a>
          <button id="closeReader" type="button" title="Chiudi" aria-label="Chiudi">×</button>
        </div>
      </header>
      <div class="stage" id="stage"><div class="viewer-message">Seleziona una guida.</div></div>
    </div>
  </dialog>

  <script>
  (() => {
    "use strict";
    /* CONFIGURAZIONE GITHUB
       Caso normale: galleria-guide.html e cartella pdf nella radice del sito
       https://UTENTE.github.io/REPOSITORY/ . Puoi lasciare questi valori vuoti.
       Dominio personalizzato o struttura diversa: compila owner e repo.
       branch: ramo usato da Pages; vuoto = ramo predefinito del repository.
       sourceRoot: "docs" se Pages pubblica dalla cartella /docs, altrimenti "".
       folder: cartella dei PDF, relativa a questo HTML. Solo file diretti.
       Non inserire token o password: il repository deve essere pubblico.
       Pubblica con GitHub Pages, non con il link github.com/.../blob/...
       WordPress: incorpora l'URL Pages in un iframe, senza plugin.
    */
    const CONFIG = {
      owner: "",
      repo: "",
      branch: "",
      sourceRoot: "",
      folder: "pdf"
    };

    const gallery=document.querySelector("#gallery"), count=document.querySelector("#count"), search=document.querySelector("#search");
    const reader=document.querySelector("#reader"), stage=document.querySelector("#stage"), title=document.querySelector("#readerTitle"), original=document.querySelector("#openOriginal");
    let records=[], opener=null;
    const normalize=s=>String(s||"").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g," ").trim();
    const encodePath=path=>path.split("/").filter(Boolean).map(encodeURIComponent).join("/");
    function cleanPath(path){
      const parts=String(path||"").split("/").filter(Boolean);
      if(parts.some(p=>p==="."||p===".."||p.includes("\\")))throw Error("Usa cartelle senza punti relativi o barre inverse nella configurazione.");
      return parts.join("/");
    }
    function githubLocation(){
      if(!["https:","http:"].includes(location.protocol))throw Error("Pubblica questo HTML su GitHub Pages: non aprirlo con doppio clic dal computer.");
      const parts=location.pathname.split("/").filter(Boolean).map(decodeURIComponent);
      // This deliverable has a filename; the last component is the HTML file.
      if(!location.pathname.endsWith("/"))parts.pop();
      let owner=CONFIG.owner.trim(),repo=CONFIG.repo.trim(),relative=parts.slice();
      if(location.hostname.endsWith(".github.io")){
        owner=owner||location.hostname.slice(0,-10);
        if(!repo){repo=parts.length?parts[0]:owner+".github.io";}
        if(repo.toLowerCase()!==(owner+".github.io").toLowerCase()&&relative[0]===repo)relative.shift();
      }
      if(!owner||!repo)throw Error("Compila owner e repo nel blocco CONFIG dell'HTML per usare questo dominio.");
      if(!/^[a-z0-9-]+$/i.test(owner)||!/^[-a-z0-9_.]+$/i.test(repo))throw Error("CONFIG: owner o repo non validi.");
      const folder=cleanPath(CONFIG.folder);
      const path=cleanPath([CONFIG.sourceRoot,...relative,folder].filter(Boolean).join("/"));
      const api=new URL("https://api.github.com/repos/"+encodeURIComponent(owner)+"/"+encodeURIComponent(repo)+"/contents/"+encodePath(path));
      if(CONFIG.branch.trim())api.searchParams.set("ref",CONFIG.branch.trim());
      const pdfBase=new URL(encodePath(folder)+(folder?"/":""),new URL(".",location.href));
      return {api:api.href,pdfBase};
    }
    function filesToRecords(files,base){
      if(!Array.isArray(files))throw Error("Il percorso configurato deve indicare una cartella del repository.");
      if(files.length>=1000)throw Error("La cartella raggiunge il limite dell'API GitHub (1.000 elementi). Suddividi il catalogo prima di continuare.");
      return files.filter(f=>f&&f.type==="file"&&typeof f.name==="string"&&/\.pdf$/i.test(f.name)&&!/[\/\\]/.test(f.name))
        .map(f=>({title:f.name.replace(/\.pdf$/i,"").replace(/[_-]+/g," ").trim()||f.name,body:"Documento PDF",pdf:new URL(encodeURIComponent(f.name),base).href,image:""}))
        .sort((a,b)=>a.title.localeCompare(b.title,"it",{numeric:true,sensitivity:"base"}));
    }
    function status(message){const el=document.createElement("div");el.className="status";el.textContent=message;gallery.replaceChildren(el);}
    function renderCards(list){
      count.textContent=list.length;
      gallery.replaceChildren();
      if(!list.length){status(records.length?"Nessuna guida corrisponde alla ricerca.":"Nessun PDF nella cartella configurata. Carica i file direttamente nella cartella pdf del repository, senza sottocartelle.");return;}
      for(const x of list){
        const card=document.createElement("article");card.className="card";
        const cover=document.createElement("div");cover.className="cover no-image";
        if(x.image){const img=new Image();img.alt="";img.loading="lazy";img.referrerPolicy="no-referrer";img.onload=()=>cover.classList.remove("no-image");img.onerror=()=>img.remove();img.src=x.image;cover.append(img);}
        const body=document.createElement("div");body.className="card-body";
        const heading=document.createElement("h2");heading.textContent=x.title;
        const desc=document.createElement("p");desc.className="description";desc.textContent=x.body||"Apri la guida per leggerla nel visualizzatore.";
        const link=document.createElement("a");link.className="read card-link";link.textContent="Leggi la guida";link.href=x.pdf;link.target="_blank";link.rel="noopener noreferrer";
        link.addEventListener("click",e=>{if(e.ctrlKey||e.metaKey||e.shiftKey||e.altKey)return;if(typeof reader.showModal!=="function")return;e.preventDefault();openPDF(x,link);});
        body.append(heading,desc,link);card.append(cover,body);gallery.append(card);
      }
    }
    async function loadCatalogue(){
      let controller,timer;
      try{
        const source=githubLocation();
        controller=new AbortController();timer=setTimeout(()=>controller.abort(),15000);
        const response=await fetch(source.api,{headers:{Accept:"application/vnd.github+json"},signal:controller.signal});
        if(!response.ok){
          if(response.status===404)throw Error("Repository, ramo o cartella non trovati. Controlla CONFIG, maiuscole/minuscole e che il repository sia pubblico.");
          if(response.status===403||response.status===429)throw Error("GitHub ha limitato le richieste oppure l'accesso. Attendi e riprova più tardi.");
          throw Error("GitHub risponde con errore HTTP "+response.status+".");
        }
        records=filesToRecords(await response.json(),source.pdfBase);
        applySearch();
      }catch(error){
        console.error(error);
        status("Impossibile caricare le guide. "+(error.name==="AbortError"?"GitHub non risponde: ricarica la pagina.":error.message));
      }finally{clearTimeout(timer);}
    }
    function openPDF(item,link){
      opener=link;title.textContent=item.title;original.href=item.pdf;
      const help=document.createElement("p");help.className="reader-help";help.textContent="Se il documento non appare, usa “Apri PDF”. Su smartphone può aprirsi nel lettore del dispositivo. I comandi di pagina, ricerca e zoom dipendono dal browser.";
      const frame=document.createElement("iframe");frame.className="pdf-frame";frame.title="Documento PDF: "+item.title;frame.referrerPolicy="no-referrer";
      reader.showModal();document.body.classList.add("reading");stage.replaceChildren(help,frame);
      frame.src=item.pdf;
    }
    function applySearch(){const q=normalize(search.value);renderCards(records.filter(x=>normalize(x.title+" "+x.body).includes(q)));}
    search.addEventListener("input",applySearch);
    document.querySelector("#closeReader").addEventListener("click",()=>reader.close());
    reader.addEventListener("click",e=>{if(e.target===reader){const r=reader.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)reader.close();}});
    reader.addEventListener("close",()=>{stage.replaceChildren();document.body.classList.remove("reading");if(opener&&opener.isConnected)opener.focus();original.removeAttribute("href");});
    loadCatalogue();
  })();
  </script>
</body>
</html>
