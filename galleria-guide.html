<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Galleria delle guide LUDiCa con lettore PDF integrato">
  <title>Guide del LUDiCa</title>
    <style>
    :root{--ink:#202124;--muted:#64717b;--red:#c50000;--blue:#008fd5;--paper:#f4f7f9;--line:#d9e0e5;--white:#fff;--shadow:0 12px 32px rgba(25,38,48,.13)}
    *{box-sizing:border-box}
    body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
    button,input{font:inherit}
    button{cursor:pointer}
    .site{max-width:1220px;margin:auto;padding:clamp(22px,4vw,58px)}
    .hero{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;margin-bottom:30px}
    .eyebrow{color:var(--red);font-size:.82rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
    h1{margin:.15em 0 .1em;font-size:clamp(2rem,5vw,4.3rem);line-height:1.03;letter-spacing:-.04em}
    .intro{max-width:720px;margin:0;color:var(--muted);font-size:1.05rem}
    .counter{min-width:110px;text-align:right;color:var(--muted)}
    .counter strong{display:block;color:var(--ink);font-size:2rem;line-height:1}
    .tools{display:flex;gap:12px;align-items:center;margin:0 0 28px}
    .search{width:min(560px,100%);border:1px solid var(--line);border-radius:14px;background:var(--white);padding:13px 16px;color:var(--ink);outline:none}
    .search:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,143,213,.14)}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:22px}
    .card{display:flex;min-height:100%;flex-direction:column;overflow:hidden;border:1px solid var(--line);border-radius:18px;background:var(--white);box-shadow:0 4px 15px rgba(25,38,48,.06);transition:transform .18s,box-shadow .18s}
    .card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
    .cover{position:relative;aspect-ratio:4/3;overflow:hidden;background:linear-gradient(135deg,#eaf6fb,#f8eeee)}
    .cover img{width:100%;height:100%;display:block;object-fit:cover}
    .cover.no-image::after{content:"PDF";position:absolute;inset:0;display:grid;place-items:center;color:var(--red);font-size:3rem;font-weight:900;letter-spacing:.08em}
    .card-body{display:flex;flex:1;flex-direction:column;padding:20px}
    .card h2{margin:0 0 8px;font-size:1.25rem;line-height:1.25}
    .description{display:-webkit-box;overflow:hidden;margin:0 0 18px;color:var(--muted);-webkit-box-orient:vertical;-webkit-line-clamp:4}
    .read{align-self:flex-start;margin-top:auto;border:0;border-radius:999px;background:var(--ink);color:var(--white);padding:10px 18px;font-weight:750}
    .read:hover,.read:focus-visible{background:var(--red)}
    .status{grid-column:1/-1;border:1px solid var(--line);border-radius:16px;background:var(--white);padding:28px;text-align:center;color:var(--muted)}
    .dialog{width:min(1120px,96vw);height:min(94vh,950px);max-width:none;max-height:none;padding:0;border:0;border-radius:18px;background:#2b3035;color:white;box-shadow:0 22px 80px rgba(0,0,0,.4)}
    .dialog::backdrop{background:rgba(14,18,21,.78);backdrop-filter:blur(4px)}
    .viewer{display:grid;height:100%;grid-template-rows:auto 1fr}
    .viewer-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:12px 14px;background:#171a1d}
    .viewer-title{overflow:hidden;margin:0;font-size:1rem;text-overflow:ellipsis;white-space:nowrap}
    .controls{display:flex;flex-wrap:wrap;gap:7px;justify-content:flex-end;align-items:center}
    .controls button{min-width:38px;border:1px solid #535b62;border-radius:8px;background:#30363b;color:#fff;padding:7px 10px}
    .controls button:hover,.controls button:focus-visible{border-color:#fff;background:#454d54}
    .page-label{min-width:88px;text-align:center;font-size:.9rem;color:#d8dde1}
    .stage{overflow:auto;display:grid;place-items:start center;padding:22px;background:#454b50;overscroll-behavior:contain}
    canvas{display:block;max-width:none;background:white;box-shadow:0 8px 28px rgba(0,0,0,.35)}
    .viewer-message{align-self:center;max-width:680px;border-radius:12px;background:#fff;color:var(--ink);padding:18px 22px;text-align:center}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:700px){.site{padding:22px 16px}.hero{grid-template-columns:1fr}.counter{text-align:left}.viewer-head{grid-template-columns:1fr}.controls{justify-content:flex-start}.dialog{width:100vw;height:100vh;border-radius:0}.stage{padding:10px}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="site">
    <header class="hero">
      <div>
        <div class="eyebrow">Le guide L U Di Ca</div>
        <h1>Le guide del LUDiCa</h1>
        <p class="intro">Aperte, libere, sempre in aggiornamento</p>
      </div>
      <div class="counter" aria-live="polite"><strong id="count">0</strong><span>guide</span></div>
    </header>
    <div class="tools">
      <label class="sr-only" for="search">Cerca nelle guide</label>
      <input class="search" id="search" type="search" placeholder="Cerca per titolo o contenuto…" autocomplete="off">
    </div>
    <section class="grid" id="gallery" aria-live="polite"><div class="status">Caricamento delle guide…</div></section>
  </main>

  <dialog class="dialog" id="reader" aria-labelledby="readerTitle">
    <div class="viewer">
      <header class="viewer-head">
        <h2 class="viewer-title" id="readerTitle">Guida</h2>
        <div class="controls" aria-label="Comandi del lettore">
          <button id="prev" type="button" title="Pagina precedente" aria-label="Pagina precedente">←</button>
          <span class="page-label" id="pageLabel">Pagina 1 / 1</span>
          <button id="next" type="button" title="Pagina successiva" aria-label="Pagina successiva">→</button>
          <button id="zoomOut" type="button" title="Riduci" aria-label="Riduci">−</button>
          <button id="zoomIn" type="button" title="Ingrandisci" aria-label="Ingrandisci">+</button>
          <button id="fit" type="button" title="Adatta alla larghezza">Adatta</button>
          <button id="closeReader" type="button" title="Chiudi" aria-label="Chiudi">×</button>
        </div>
      </header>
      <div class="stage" id="stage"><div class="viewer-message">Seleziona una guida.</div></div>
    </div>
  </dialog>

  <script type="module">
    import * as pdfjsLib from "https://cdn.jsdelivr.net/npm/pdfjs-dist@latest/build/pdf.min.mjs";
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@latest/build/pdf.worker.min.mjs";

    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRnbHCs4ZDmMDJYRyP5vbQ4iY97UKBfe-_THwDbICkgeHy7plN96vXHZXzi1mvWsW5dtZBY1nfoN0sI/pub?gid=2071037840&single=true&output=csv";
    const gallery = document.querySelector("#gallery");
    const count = document.querySelector("#count");
    const search = document.querySelector("#search");
    const reader = document.querySelector("#reader");
    const stage = document.querySelector("#stage");
    const readerTitle = document.querySelector("#readerTitle");
    const pageLabel = document.querySelector("#pageLabel");
    let records = [], pdf = null, pageNumber = 1, scale = 1.25, renderTask = null, fitWidth = true;

    function parseCSV(text){
      const rows=[]; let row=[], field="", quoted=false;
      for(let i=0;i<text.length;i++){
        const ch=text[i];
        if(quoted){
          if(ch==='"' && text[i+1]==='"'){field+='"';i++;}
          else if(ch==='"'){quoted=false;}
          else field+=ch;
        }else if(ch==='"'){quoted=true;}
        else if(ch===','){row.push(field);field="";}
        else if(ch==='\n'){row.push(field);rows.push(row);row=[];field="";}
        else if(ch!=='\r'){field+=ch;}
      }
      if(field.length||row.length){row.push(field);rows.push(row);}
      return rows;
    }
    const normalize=s=>String(s||"").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g," ").trim();
    const safeUrl=value=>{try{const u=new URL(String(value||"").trim(),location.href);return ["http:","https:"].includes(u.protocol)?u.href:"";}catch{return "";}};
    const directPdfUrl=value=>{
      const cleaned=safeUrl(value);
      if(!cleaned) return "";
      try{
        const u=new URL(cleaned);
        /* Evita il blocco "mixed content": una pagina HTTPS non può caricare
           un PDF indicato con HTTP. GitHub Pages è disponibile in HTTPS. */
        if(u.protocol==="http:" && u.hostname.toLowerCase().endsWith(".github.io")){
          u.protocol="https:";
        }
        /* Converte automaticamente:
           https://github.com/utente/repository/blob/ramo/cartella/file.pdf
           in:
           https://raw.githubusercontent.com/utente/repository/ramo/cartella/file.pdf */
        if(u.hostname.toLowerCase()==="github.com"){
          const parts=u.pathname.split("/").filter(Boolean);
          const marker=parts.indexOf("blob");
          if(marker===2 && parts.length>4){
            const [owner,repo]=parts;
            const remainder=parts.slice(marker+1).map(decodeURIComponent).map(encodeURIComponent).join("/");
            return `https://raw.githubusercontent.com/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/${remainder}`;
          }
        }
        return u.href;
      }catch{return cleaned;}
    };
    function rowsToRecords(rows){
      const headers=(rows.shift()||[]).map(normalize);
      const find=(...names)=>headers.findIndex(h=>names.some(n=>h===n||h.startsWith(n)));
      const iTitle=find("titolo"), iBody=find("contenuto","descrizione"), iPdf=find("url per leggere","url pdf","pdf"), iImage=find("url immagine anteprima","immagine anteprima","anteprima");
      if(iTitle<0||iPdf<0) throw new Error("Il foglio deve contenere almeno le colonne ‘titolo’ e ‘url per leggere’. ");
      return rows.map(r=>({title:(r[iTitle]||"").trim(),body:(r[iBody]||"").trim(),pdf:directPdfUrl(r[iPdf]),image:iImage>=0?safeUrl(r[iImage]):""})).filter(x=>x.title&&x.pdf);
    }
    function esc(s){const e=document.createElement("span");e.textContent=s;return e.innerHTML;}
    function renderCards(list){
      count.textContent=list.length;
      if(!list.length){gallery.innerHTML='<div class="status">Nessuna guida corrisponde alla ricerca.</div>';return;}
      gallery.innerHTML=list.map((x,i)=>`<article class="card">
        <div class="cover ${x.image?'':'no-image'}">${x.image?`<img src="${esc(x.image)}" alt="" loading="lazy" referrerpolicy="no-referrer">`:''}</div>
        <div class="card-body"><h2>${esc(x.title)}</h2><p class="description">${esc(x.body||'Apri la guida per leggerla nel visualizzatore.')}</p>
        <button class="read" type="button" data-index="${records.indexOf(x)}">Leggi la guida</button></div></article>`).join("");
    }
    async function loadCatalogue(){
      try{
        const response=await fetch(CSV_URL,{cache:"no-store"});
        if(!response.ok) throw new Error(`Errore HTTP ${response.status}`);
        records=rowsToRecords(parseCSV(await response.text()));
        renderCards(records);
      }catch(error){
        console.error(error);
        gallery.innerHTML='<div class="status"><strong>Impossibile caricare il catalogo.</strong><br>Controlla che il foglio Google sia pubblicato come CSV e che le intestazioni siano corrette.</div>';
      }
    }
    async function openPDF(item){
      readerTitle.textContent=item.title; stage.innerHTML='<div class="viewer-message">Caricamento del PDF…</div>'; reader.showModal();
      try{
        pdf=await pdfjsLib.getDocument({url:item.pdf}).promise; pageNumber=1; fitWidth=true; await renderPage();
      }catch(error){
        console.error(error); pdf=null; stage.innerHTML='<div class="viewer-message"><strong>Il PDF non può essere visualizzato.</strong><br>Usa un URL diretto al file PDF ospitato su GitHub Pages o su un server che consenta l’accesso CORS.</div>';
      }
    }
    async function renderPage(){
      if(!pdf)return;
      if(renderTask){try{renderTask.cancel();}catch{}}
      const page=await pdf.getPage(pageNumber); const base=page.getViewport({scale:1});
      if(fitWidth) scale=Math.max(.5,Math.min(2.8,(stage.clientWidth-44)/base.width));
      const viewport=page.getViewport({scale}); const ratio=Math.min(window.devicePixelRatio||1,2);
      const canvas=document.createElement("canvas"); canvas.width=Math.floor(viewport.width*ratio); canvas.height=Math.floor(viewport.height*ratio); canvas.style.width=`${viewport.width}px`; canvas.style.height=`${viewport.height}px`;
      stage.replaceChildren(canvas); const context=canvas.getContext("2d",{alpha:false});
      renderTask=page.render({canvasContext:context,viewport,transform:ratio!==1?[ratio,0,0,ratio,0,0]:null});
      try{await renderTask.promise;}catch(e){if(e?.name!=="RenderingCancelledException")throw e;}
      pageLabel.textContent=`Pagina ${pageNumber} / ${pdf.numPages}`; document.querySelector("#prev").disabled=pageNumber<=1; document.querySelector("#next").disabled=pageNumber>=pdf.numPages; stage.scrollTo({top:0,left:0});
    }
    gallery.addEventListener("click",e=>{const b=e.target.closest("[data-index]");if(b)openPDF(records[Number(b.dataset.index)]);});
    search.addEventListener("input",()=>{const q=normalize(search.value);renderCards(records.filter(x=>normalize(`${x.title} ${x.body}`).includes(q)));});
    document.querySelector("#prev").onclick=()=>{if(pdf&&pageNumber>1){pageNumber--;renderPage();}};
    document.querySelector("#next").onclick=()=>{if(pdf&&pageNumber<pdf.numPages){pageNumber++;renderPage();}};
    document.querySelector("#zoomOut").onclick=()=>{if(pdf){fitWidth=false;scale=Math.max(.5,scale-.2);renderPage();}};
    document.querySelector("#zoomIn").onclick=()=>{if(pdf){fitWidth=false;scale=Math.min(3.5,scale+.2);renderPage();}};
    document.querySelector("#fit").onclick=()=>{if(pdf){fitWidth=true;renderPage();}};
    document.querySelector("#closeReader").onclick=()=>reader.close();
    reader.addEventListener("click",e=>{if(e.target===reader)reader.close();});
    reader.addEventListener("close",()=>{if(renderTask){try{renderTask.cancel();}catch{}}pdf=null;stage.innerHTML='<div class="viewer-message">Seleziona una guida.</div>';});
    window.addEventListener("resize",()=>{if(reader.open&&pdf&&fitWidth)renderPage();},{passive:true});
    loadCatalogue();
  </script>
</body>
</html>
